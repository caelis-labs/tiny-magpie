name: Test tiny-magpie
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: tiny-test-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      GOWORK: off
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Linux GUI dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Scope
        run: python3 scripts/check-scope.py
      - name: Headless checks
        shell: bash
        run: |
          go vet -tags nogui ./...
          go test -tags nogui -timeout 20m ./...
      - name: Native build
        shell: bash
        run: |
          tags=production
          if [ "$RUNNER_OS" = Linux ]; then tags=production,gtk3; fi
          go build -tags "$tags" -o tiny-magpie-native .
  protocols-and-ui:
    runs-on: macos-latest
    env:
      GOWORK: off
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build pinned upstream and tiny
        shell: bash
        run: |
          mkdir -p .tiny/upstream
          base=$(python3 -c 'import json;print(json.load(open("UPSTREAM.json"))["base"])')
          git archive "$base" | tar -x -C .tiny/upstream
          (cd .tiny/upstream && go build -tags nogui -o ../magpie-upstream .)
          go build -tags nogui -o .tiny/tiny-magpie .
          python3 scripts/verify-gateway.py --baseline .tiny/magpie-upstream --tiny .tiny/tiny-magpie
      - run: npm ci
      - run: npx playwright install chromium webkit
      - run: npm run test:ui
        env:
          ARTIFACT_DIR: output/playwright
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: output/playwright/
