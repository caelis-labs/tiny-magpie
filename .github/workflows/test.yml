name: Test tiny-magpie
on:
  pull_request:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: tiny-test-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ github.event_name == 'schedule' && 60 || 20 }}
    env:
      GOWORK: off
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            **/*.go
            .github/workflows/test.yml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Pin Go caches before test homes change
        shell: bash
        run: |
          for tiny_cache_name in GOPATH GOMODCACHE GOCACHE; do
            tiny_cache_path=$(go env "$tiny_cache_name")
            printf '%s=%s\n' "$tiny_cache_name" "$tiny_cache_path" >> "$GITHUB_ENV"
          done
      - name: Linux GUI dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Scope
        run: python3 scripts/check-scope.py
      - name: Go vet
        shell: bash
        run: go vet -tags nogui ./...
      - name: Windows fixture regressions
        if: runner.os == 'Windows'
        shell: bash
        run: |
          tiny_test_status=0
          go test -json -count=1 -tags nogui -timeout 10m -run '^(TestTiny.*|TestWindows.*|TestCodex.*Keychain.*|TestCodexStoreNotReadIsLeftAlone|TestSavedButSignedOut|TestPluginLeavesTheUserNetworkDirect|TestLoadConcurrentWithSavesAndEdits|TestSaveConcurrent.*|TestWrite|TestSQLiteSurvivesMalformedEnv|TestDesktopSessionAccountMetadata|TestCachePartialUpdateMatrix|TestClaudeAsRootEnv|TestStatWaitsOutAReplace|TestMissingProbeStaysShort)$' ./internal/agent ./internal/agentplug ./internal/provider ./internal/plugin ./internal/shortcut ./internal/sqlitedb ./internal/usage ./internal/settings ./internal/steady ./internal/gateway ./internal/gui ./internal/update 2>&1 | python -u -X utf8 scripts/ci-go-output.py output/windows-fixtures.log || tiny_test_status=$?
          exit "$tiny_test_status"
      - name: Windows state and proxy stress
        if: runner.os == 'Windows'
        shell: bash
        run: |
          tiny_test_status=0
          tiny_stress_count=5
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then tiny_stress_count=20; fi
          go test -json -count="$tiny_stress_count" -tags nogui -timeout 10m ./internal/provider ./internal/plugin ./internal/steady -run '^(TestLoginsKeptWhileAnotherMagpieWrites|TestPluginLeavesTheUserNetworkDirect|TestLoginsFallbackStaysInItsProfile|TestDeletedKnownLoginsStayDeleted|TestMissingProbeStaysShort)$' 2>&1 | python -u -X utf8 scripts/ci-go-output.py output/windows-stress.log || tiny_test_status=$?
          exit "$tiny_test_status"
      - name: Compile every Windows test
        if: runner.os == 'Windows'
        shell: bash
        run: |
          tiny_test_status=0
          go test -json -count=1 -tags nogui -run '^$' ./... 2>&1 | python -u -X utf8 scripts/ci-go-output.py output/windows-compile.log || tiny_test_status=$?
          exit "$tiny_test_status"
      - name: Go suite
        if: runner.os != 'Windows' || github.event_name == 'schedule'
        shell: bash
        run: |
          tiny_test_status=0
          tiny_test_timeout=20m
          # Native Windows paths/state run on every PR above; its full
          # retained suite runs weekly, outside the PR/release critical path.
          if [ "$RUNNER_OS" = Windows ]; then tiny_test_timeout=45m; fi
          go test -json -count=1 -tags nogui -timeout "$tiny_test_timeout" ./... 2>&1 | python -u -X utf8 scripts/ci-go-output.py || tiny_test_status=$?
          exit "$tiny_test_status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: go-test-${{ matrix.os }}
          path: |
            output/go-test.*
            output/windows-*
      - name: Linux legacy Tiny data migration
        if: runner.os == 'Linux'
        shell: bash
        run: |
          go test -c -tags nogui -o "$RUNNER_TEMP/tiny-magpie-legacy.test" ./internal/gui
          "$RUNNER_TEMP/tiny-magpie-legacy.test" -test.run '^TestKeepWebData$' -test.count=1 -test.v
      - name: Native build
        shell: bash
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in
            macOS) make app VERSION=0.0.0 ;;
            Windows) make release-windows VERSION=0.0.0 WINARCHES="$(go env GOARCH)" ;;
            Linux) make release-linux VERSION=0.0.0 ;;
          esac
          platform="$(go env GOOS)-$(go env GOARCH)"
          make release-cli VERSION=0.0.0 TARGETS="$(go env GOOS)/$(go env GOARCH)"
          python3 scripts/release-artifacts.py verify-native --version 0.0.0 --platform "$platform"
          if [ "$RUNNER_OS" = macOS ]; then
            bash scripts/create-macos-dmg.sh "$RUNNER_TEMP/tiny-test.dmg"
            bash scripts/test-macos-dmg.sh "$RUNNER_TEMP/tiny-test.dmg"
          fi
  protocols-and-ui:
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      GOWORK: off
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build pinned upstream and tiny
        shell: bash
        run: |
          mkdir -p .tiny/upstream
          base=$(python3 -c 'import json;print(json.load(open("UPSTREAM.json"))["base"])')
          git archive "$base" | tar -x -C .tiny/upstream
          (cd .tiny/upstream && go build -tags nogui -o ../magpie-upstream .)
          go build -tags nogui -o .tiny/tiny-magpie .
          python3 scripts/verify-gateway.py --baseline .tiny/magpie-upstream --tiny .tiny/tiny-magpie
      - name: Release draft and immutable asset recovery
        run: python3 scripts/test-publish-release.py
      - name: Native release inventory and provenance
        run: python3 scripts/test-release-artifacts.py
      - name: Apple ticket retry and trusted checkpoint recovery
        run: |
          python3 scripts/test-notarization-stapler.py
          python3 scripts/test-release-resume.py
      - run: npm ci
      - run: npx playwright install --only-shell chromium webkit
      - run: npm run test:ui
        env:
          ARTIFACT_DIR: output/playwright
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: output/playwright/
