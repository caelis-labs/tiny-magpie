name: Package tiny-magpie
on:
  workflow_dispatch:
    inputs:
      version:
        description: Artifact version (no publishing or upstream release dispatch)
        required: true
        default: 0.1.0-dev
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Linux WebView dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Package
        shell: bash
        env:
          GOWORK: off
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^[0-9][0-9A-Za-z.+-]*$ ]]
          mkdir -p dist
          case "$RUNNER_OS" in
            macOS) make app VERSION="$VERSION"; ditto -c -k --sequesterRsrc --keepParent tiny-magpie.app dist/tiny-magpie-macos.zip ;;
            Windows) make release-windows VERSION="$VERSION" ;;
            Linux) make release-linux VERSION="$VERSION" ;;
          esac
          make release-cli VERSION="$VERSION" TARGETS='darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64 windows/arm64'
          cp UPSTREAM.json dist/
          python3 - <<'PY'
          import hashlib, pathlib
          out=pathlib.Path('dist')
          (out/'SHA256SUMS').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n' for p in sorted(out.iterdir()) if p.is_file() and p.name!='SHA256SUMS'))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: tiny-magpie-${{ runner.os }}
          path: dist/
