name: Release tiny-magpie
on:
  push:
    tags: ['tiny-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tiny-vX.Y.Z tag on main
        required: true
        type: string
      resume_run_id:
        description: Completed tag run with accepted app/CLI checkpoint before DMG creation
        required: false
        default: ''
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: tiny-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  source:
    if: github.repository == 'caelis-labs/tiny-magpie'
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      version: ${{ steps.source.outputs.version }}
      tag: ${{ steps.source.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: source
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^tiny-v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          sha=$(git rev-parse "refs/tags/$TAG^{commit}")
          git merge-base --is-ancestor "$sha" origin/main
          if [ -n "$RESUME_RUN_ID" ]; then
            [[ "$RESUME_RUN_ID" =~ ^[1-9][0-9]*$ ]]
            gh api "repos/caelis-labs/tiny-magpie/actions/runs/$RESUME_RUN_ID" > "$RUNNER_TEMP/original-run.json"
            gh api "repos/caelis-labs/tiny-magpie/actions/runs/$RESUME_RUN_ID/jobs?per_page=100" > "$RUNNER_TEMP/original-jobs.json"
            python3 scripts/verify-release-resume.py "$RUNNER_TEMP/original-run.json" "$RUNNER_TEMP/original-jobs.json" "$RESUME_RUN_ID" "$TAG" "$sha"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#tiny-v}" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
  checks:
    if: inputs.resume_run_id == ''
    needs: source
    uses: ./.github/workflows/test.yml
    with:
      ref: ${{ needs.source.outputs.sha }}
  containers:
    if: inputs.resume_run_id == ''
    needs: source
    uses: ./.github/workflows/docker.yml
    with:
      ref: ${{ needs.source.outputs.sha }}
  package:
    needs: [source, checks, containers]
    if: always() && needs.source.result == 'success' && (inputs.resume_run_id != '' || (needs.checks.result == 'success' && needs.containers.result == 'success'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: darwin-arm64
          - os: ubuntu-24.04
            platform: linux-amd64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
          - os: windows-latest
            platform: windows-amd64
          - os: windows-11-arm
            platform: windows-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      GOWORK: off
      VERSION: ${{ needs.source.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        if: inputs.resume_run_id != '' && runner.os == 'macOS'
        with:
          ref: ${{ github.sha }}
          path: .tiny/recovery-tools
          persist-credentials: false
      - uses: actions/download-artifact@v4
        if: inputs.resume_run_id != '' && runner.os == 'macOS'
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.resume_run_id }}
          name: notary-receipt-${{ matrix.platform }}
          path: .tiny/resume-notary
      - uses: actions/download-artifact@v4
        if: inputs.resume_run_id != '' && runner.os != 'macOS'
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.resume_run_id }}
          name: release-${{ matrix.platform }}
          path: output/release
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          architecture: ${{ endsWith(matrix.platform, '-arm64') && 'arm64' || 'x64' }}
      - name: Linux WebView dependencies
        if: runner.os == 'Linux' && inputs.resume_run_id == ''
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Build native desktop and CLI
        if: inputs.resume_run_id == ''
        shell: bash
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in
            macOS) make app VERSION="$VERSION"; targets="darwin/$(go env GOARCH)" ;;
            Windows) make release-windows VERSION="$VERSION" WINARCHES="$(go env GOARCH)"; targets="windows/$(go env GOARCH)" ;;
            Linux) make release-linux VERSION="$VERSION"; targets="linux/$(go env GOARCH)" ;;
          esac
          make release-cli VERSION="$VERSION" TARGETS="$targets"
      - name: Developer ID signing, notarization and Gatekeeper
        if: runner.os == 'macOS'
        env:
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_NOTARY_APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          TINY_NOTARY_RESUME_DIR: ${{ inputs.resume_run_id != '' && '.tiny/resume-notary' || '' }}
          SIGNING_SCRIPT: ${{ inputs.resume_run_id != '' && '.tiny/recovery-tools/scripts/sign-notarize-macos.sh' || 'scripts/sign-notarize-macos.sh' }}
        run: bash "$SIGNING_SCRIPT" '${{ matrix.platform }}'
      - name: Package with license and source evidence
        if: inputs.resume_run_id == '' || runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/release-artifacts.py package --version "$VERSION" --platform '${{ matrix.platform }}'
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: output/release/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'macOS'
        with:
          name: notary-receipt-${{ matrix.platform }}
          path: output/notary/
  publish:
    needs: [source, package]
    if: inputs.resume_run_id == '' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: output/release
          merge-multiple: true
      - name: Verify inventory and publish Tiny release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.source.outputs.tag }}
          VERSION: ${{ needs.source.outputs.version }}
        run: |
          python3 scripts/release-artifacts.py finalize --version "$VERSION"
          tiny_channel=()
          if [[ "$VERSION" != *-* ]]; then tiny_channel=(--stable); fi
          python3 scripts/publish-release.py "$RELEASE_TAG" "${tiny_channel[@]}"
