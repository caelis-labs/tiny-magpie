name: Docker smoke test
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build and check isolated image
        shell: bash
        run: |
          docker build --load -t tiny-magpie-smoke .
          ./scripts/check-container.sh tiny-magpie-smoke
