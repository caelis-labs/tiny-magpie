name: Upstream inventory
on:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: tiny-upstream-inventory
  cancel-in-progress: false
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compare integrated base with upstream main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/yetone/magpie.git
          git fetch --no-tags upstream main:refs/remotes/upstream/main
          python3 scripts/check-scope.py
          python3 scripts/upstream-inventory.py
      - uses: actions/upload-artifact@v4
        with:
          name: upstream-inventory
          path: output/upstream-*.txt
